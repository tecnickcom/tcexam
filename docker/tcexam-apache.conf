# Apache configuration for the TCExam runtime image (plan Stage 7).
# The document root is the application root (/var/www/html); the root index.php redirects to
# public/code/. AllowOverride All lets the shipped .htaccess files (install/, admin/backup/)
# take effect — they restrict access to sensitive paths.

ServerName tcexam.local
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Defence in depth: never serve the application configuration or the version-control metadata.
<DirectoryMatch "/var/www/html/(shared|admin|public)/config(\.default)?">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "/var/www/html/\.git">
    Require all denied
</DirectoryMatch>

# Uploaded and generated files in cache/ are served as passive content only (same rules as cache/.htaccess).
<Directory /var/www/html/cache>
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]?|pht|phtml|phar|phps|cgi|pl|py|sh|asp|aspx|jsp)(\.|$)">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
    <FilesMatch "(?i)\.(xml|xslt?|xht|xhtml|s?html?|mht|mhtml|m?js|swf)$">
        ForceType application/octet-stream
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox"
    <FilesMatch "(?i)\.(svgz?|xml|xslt?|xht|xhtml|s?html?|mht|mhtml|m?js|swf)$">
        Header always set Content-Disposition "attachment"
    </FilesMatch>
</Directory>
